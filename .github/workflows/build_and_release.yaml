name: Build and release Aseprite (AppImage)

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:
env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest
    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release link
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
            group: aseprite
            repo: aseprite
            match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    permissions:
      contents: write
    outputs:
      download-link: ${{ needs.fetch-aseprite-info.outputs.download-link }}
      release-tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (openSUSE Tumbleweed)
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          zypper refresh
          # Added 'file' which is required by AppImageTool
          zypper install -y git-core cmake ninja gcc-c++ wget unzip p7zip tar gzip curl file
          zypper install -y \
            libpixman-1-0-devel freetype2-devel harfbuzz-devel zlib-devel \
            libX11-devel libXcursor-devel libXi-devel libXrandr-devel \
            Mesa-libGL-devel fontconfig-devel
            
      - uses: actions/checkout@v4
      
      - name: Install Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.create-release.outputs.release-tag }}
          
      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip Skia-Linux-Release-x64.zip -d skia
          
      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on
          export skia_arch=x64

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
            
      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build && ninja
          
      - name: Package as AppImage
        shell: bash
        run: |
          # 1. Download AppImageTool (used to create the single executable file)
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

          # 2. Create the AppImage directory structure
          mkdir -p AppDir/usr/bin
          
          # Copy binary and data folder
          cp aseprite/build/bin/aseprite AppDir/usr/bin/
          cp -r aseprite/build/bin/data AppDir/usr/bin/
          
          # Create the portable ini file
          echo '# This file is here so Aseprite behaves as a portable program' > AppDir/usr/bin/aseprite.ini

          # 3. Add Desktop integration (so Linux knows the icon and app name)
          cat << 'EOF' > AppDir/aseprite.desktop
          [Desktop Entry]
          Name=Aseprite
          Exec=aseprite %U
          Icon=aseprite
          Type=Application
          Categories=Graphics;
          EOF
          
          # Copy the official icon from Aseprite source
          cp aseprite/data/icons/ase256.png AppDir/aseprite.png

          # 4. Create AppRun (the entry point script inside the AppImage)
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/aseprite" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 5. Build the final AppImage executable
          # Note: We use --appimage-extract-and-run because GitHub Docker containers don't have FUSE enabled
          ./appimagetool --appimage-extract-and-run AppDir Aseprite-${{ needs.create-release.outputs.release-tag }}-openSUSE-Tumbleweed.AppImage
        
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Aseprite-${{ needs.create-release.outputs.release-tag }}-openSUSE-Tumbleweed.AppImage
          asset_name: Aseprite-${{ needs.create-release.outputs.release-tag }}-openSUSE-Tumbleweed.AppImage
          tag: ${{ needs.create-release.outputs.release-tag }}
