name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:
env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest
    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release link
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
            group: aseprite
            repo: aseprite
            match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    permissions:
      contents: write
    outputs:
      download-link: ${{ needs.fetch-aseprite-info.outputs.download-link }}
      release-tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps:
      # Note: Changed to v4 (v7 does not exist yet for actions/checkout)
      - uses: actions/checkout@v4 
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (openSUSE Tumbleweed)
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Run all steps inside the official openSUSE Tumbleweed container
    container: opensuse/tumbleweed
    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          zypper refresh
          # Install build tools and GitHub Actions necessities (tar, gzip, curl)
          zypper install -y git-core cmake ninja gcc-c++ wget unzip p7zip tar gzip curl
          # Install Aseprite dependencies for openSUSE
          zypper install -y \
            libpixman-1-0-devel freetype2-devel harfbuzz-devel zlib-devel \
            libX11-devel libXcursor-devel libXi-devel libXrandr-devel \
            Mesa-libGL-devel fontconfig-devel
            
      - uses: actions/checkout@v4
      
      - name: Install Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.create-release.outputs.release-tag }}
          
      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip Skia-Linux-Release-x64.zip -d skia
          
      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on
          export skia_arch=x64

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
            
      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build && ninja
          
      - name: Clean Up Build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: find . -mindepth 1 ! \( -name 'aseprite' -o -name 'data' -prune \) -exec rm -rf {} +
        
      - name: Make portable zip
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
        
      - name: Create release zip
        working-directory: aseprite/build/bin
        run: 7z a -tzip Aseprite-${{ needs.create-release.outputs.release-tag }}-openSUSE-Tumbleweed.zip *
        
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.create-release.outputs.release-tag }}-openSUSE-Tumbleweed.zip
          asset_name: Aseprite-${{ needs.create-release.outputs.release-tag }}-openSUSE-Tumbleweed.zip
          tag: ${{ needs.create-release.outputs.release-tag }}
